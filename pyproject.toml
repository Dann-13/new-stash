[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencode-usage"
version = "0.4.0"
description = "Dashboard en terminal para el uso de tokens de OpenCode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
opencode-usage = "opencode_usage.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_usage"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
